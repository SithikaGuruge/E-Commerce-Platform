version: "3.8"

services:
  # Shop Service
  shop-service:
    build:
      context: ./Shop
      dockerfile: Dockerfile
    container_name: shop-service
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      - MONGO_URI=${SHOP_MONGO_URI:-mongodb+srv://sithikaguruge2001:sithika123@cluster0.xvh06.mongodb.net/Shops}
      - NODE_ENV=production
      - PORT=4001
    networks:
      - ecommerce-network

  # Product Service
  product-service:
    build:
      context: ./Product
      dockerfile: Dockerfile
    container_name: product-service
    restart: unless-stopped
    ports:
      - "4002:4002"
    environment:
      - MONGO_URI=${PRODUCT_MONGO_URI:-mongodb+srv://sithikaguruge2001:sithika123@cluster0.xvh06.mongodb.net/Products}
      - NODE_ENV=production
      - PORT=4002
    networks:
      - ecommerce-network

  # User Service
  user-service:
    build:
      context: ./User
      dockerfile: Dockerfile
    container_name: user-service
    restart: unless-stopped
    ports:
      - "4003:4003"
    environment:
      - MONGO_URI=${USER_MONGO_URI:-mongodb+srv://sithikaguruge2001:sithika123@cluster0.xvh06.mongodb.net/Users}
      - NODE_ENV=production
      - PORT=4003
    networks:
      - ecommerce-network

  # Order Service
  order-service:
    build:
      context: ./Order
      dockerfile: Dockerfile
    container_name: order-service
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - MONGO_URI=${ORDER_MONGO_URI:-mongodb+srv://sithikaguruge2001:sithika123@cluster0.xvh06.mongodb.net/Orders}
      - NODE_ENV=production
      - PORT=4000
    networks:
      - ecommerce-network

  # Client Service
  client:
    build:
      context: ../client
      dockerfile: Dockerfile
    container_name: client
    restart: unless-stopped
    ports:
      - "5173:80"
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge
