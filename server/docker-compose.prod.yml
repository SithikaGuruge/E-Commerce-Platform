# Production Docker Compose Configuration
# Use this for production deployments with external MongoDB

version: "3.8"

services:
  # Product Service
  product-service:
    build:
      context: ./Product
      dockerfile: Dockerfile
    container_name: product-service
    restart: always
    ports:
      - "4002:4002"
    environment:
      - MONGO_URI=${MONGO_URI}
      - NODE_ENV=production
      - PORT=4002
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ecommerce-network

  # Order Service
  order-service:
    build:
      context: ./Order
      dockerfile: Dockerfile
    container_name: order-service
    restart: always
    ports:
      - "4000:4000"
    environment:
      - MONGO_URI=${MONGO_URI}
      - NODE_ENV=production
      - PORT=4000
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ecommerce-network

  # Cart Service
  cart-service:
    build:
      context: ./Cart
      dockerfile: Dockerfile
    container_name: cart-service
    restart: always
    ports:
      - "4001:4001"
    environment:
      - MONGO_URI=${MONGO_URI}
      - NODE_ENV=production
      - PORT=4001
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ecommerce-network

  # User Service
  user-service:
    build:
      context: ./User
      dockerfile: Dockerfile
    container_name: user-service
    restart: always
    ports:
      - "4003:4003"
    environment:
      - MONGO_URI=${MONGO_URI}
      - NODE_ENV=production
      - PORT=4003
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ecommerce-network

  # Nginx API Gateway
  nginx:
    image: nginx:alpine
    container_name: api-gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - product-service
      - order-service
      - cart-service
      - user-service
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge
